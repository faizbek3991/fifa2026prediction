<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FIFA 2026 - Login</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-container {
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 400px;
            padding: 40px;
        }

        .logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo h1 {
            color: #667eea;
            font-size: 32px;
            margin-bottom: 10px;
        }

        .logo p {
            color: #666;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 5px rgba(102, 126, 234, 0.1);
        }

        button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        .error-message {
            color: #e74c3c;
            font-size: 13px;
            margin-top: 8px;
            display: none;
        }

        .success-message {
            color: #27ae60;
            font-size: 13px;
            margin-top: 8px;
            display: none;
        }

        .loading {
            display: none;
        }

        .toggle-link {
            text-align: center;
            margin-top: 16px;
            font-size: 13px;
            color: #666;
        }

        .toggle-link a {
            color: #667eea;
            font-weight: 600;
            text-decoration: none;
            cursor: pointer;
        }

        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo">
            <h1>⚽ FIFA 2026</h1>
            <p>Tournament Prediction Engine</p>
        </div>

        <form id="loginForm">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" required placeholder="Enter your username">
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required placeholder="Enter your password">
            </div>

            <button type="submit">
                <span class="login-text">Login</span>
                <span class="loading">Logging in...</span>
            </button>

            <div class="error-message" id="errorMsg"></div>
            <div class="success-message" id="successMsg"></div>
        </form>

        <form id="registerForm" class="hidden">
            <div class="form-group">
                <label for="regUsername">Username</label>
                <input type="text" id="regUsername" name="regUsername" required placeholder="Choose a username" minlength="3" maxlength="32">
            </div>

            <div class="form-group">
                <label for="regPassword">Password</label>
                <input type="password" id="regPassword" name="regPassword" required placeholder="Choose a password (8+ chars)" minlength="8">
            </div>

            <button type="submit">
                <span class="register-text">Create account</span>
                <span class="loading">Creating account...</span>
            </button>

            <div class="error-message" id="regErrorMsg"></div>
            <div class="success-message" id="regSuccessMsg"></div>
        </form>

        <div class="toggle-link">
            <span id="toLoginPrompt" class="hidden">Already have an account? <a id="toLogin">Log in</a></span>
            <span id="toRegisterPrompt">Don't have an account? <a id="toRegister">Register</a></span>
        </div>
    </div>

    <script>
        const loginForm = document.getElementById('loginForm');
        const registerForm = document.getElementById('registerForm');
        const errorMsg = document.getElementById('errorMsg');
        const successMsg = document.getElementById('successMsg');
        const loginText = document.querySelector('.login-text');
        const loadingText = loginForm.querySelector('.loading');
        const loginSubmitBtn = loginForm.querySelector('button');

        document.getElementById('toRegister').addEventListener('click', () => {
            loginForm.classList.add('hidden');
            registerForm.classList.remove('hidden');
            document.getElementById('toRegisterPrompt').classList.add('hidden');
            document.getElementById('toLoginPrompt').classList.remove('hidden');
        });
        document.getElementById('toLogin').addEventListener('click', () => {
            registerForm.classList.add('hidden');
            loginForm.classList.remove('hidden');
            document.getElementById('toLoginPrompt').classList.add('hidden');
            document.getElementById('toRegisterPrompt').classList.remove('hidden');
        });

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            errorMsg.style.display = 'none';
            successMsg.style.display = 'none';

            loginSubmitBtn.disabled = true;
            loginText.style.display = 'none';
            loadingText.style.display = 'inline';

            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ username, password })
                });

                const data = await response.json();

                if (data.success) {
                    successMsg.textContent = data.message;
                    successMsg.style.display = 'block';
                    setTimeout(() => {
                        window.location.href = '/dashboard';
                    }, 1000);
                } else {
                    errorMsg.textContent = data.message;
                    errorMsg.style.display = 'block';
                    loginSubmitBtn.disabled = false;
                    loginText.style.display = 'inline';
                    loadingText.style.display = 'none';
                }
            } catch (error) {
                errorMsg.textContent = 'Login failed. Please try again.';
                errorMsg.style.display = 'block';
                loginSubmitBtn.disabled = false;
                loginText.style.display = 'inline';
                loadingText.style.display = 'none';
            }
        });

        const regErrorMsg = document.getElementById('regErrorMsg');
        const regSuccessMsg = document.getElementById('regSuccessMsg');
        const registerText = document.querySelector('.register-text');
        const regLoadingText = registerForm.querySelector('.loading');
        const registerSubmitBtn = registerForm.querySelector('button');

        registerForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            const username = document.getElementById('regUsername').value;
            const password = document.getElementById('regPassword').value;

            regErrorMsg.style.display = 'none';
            regSuccessMsg.style.display = 'none';

            registerSubmitBtn.disabled = true;
            registerText.style.display = 'none';
            regLoadingText.style.display = 'inline';

            try {
                const response = await fetch('/api/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const data = await response.json();

                if (data.success) {
                    regSuccessMsg.textContent = data.message;
                    regSuccessMsg.style.display = 'block';
                    setTimeout(() => {
                        document.getElementById('toLogin').click();
                        document.getElementById('username').value = username;
                    }, 1200);
                } else {
                    regErrorMsg.textContent = data.message;
                    regErrorMsg.style.display = 'block';
                }
            } catch (error) {
                regErrorMsg.textContent = 'Registration failed. Please try again.';
                regErrorMsg.style.display = 'block';
            } finally {
                registerSubmitBtn.disabled = false;
                registerText.style.display = 'inline';
                regLoadingText.style.display = 'none';
            }
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FIFA 2026 - Login</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #07130c 0%, #0d1f14 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .login-container {
            background: #0d1f14;
            border: 1px solid #1c3a27;
            border-radius: 10px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
            width: 100%;
            max-width: 400px;
            padding: 40px;
        }
        .logo { text-align: center; margin-bottom: 30px; }
        .logo h1 { color: #e9b949; font-size: 32px; margin-bottom: 10px; }
        .logo p { color: #8fa898; font-size: 14px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; color: #e8f0ea; font-weight: 500; }
        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #1c3a27;
            border-radius: 5px;
            font-size: 14px;
            background: #07130c;
            color: #e8f0ea;
        }
        input:focus { outline: none; border-color: #2fae8f; }
        button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #2fae8f 0%, #1c3a27 100%);
            color: #e8f0ea;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }
        button:hover { opacity: 0.9; }
        .error-message { color: #e74c3c; font-size: 13px; margin-top: 8px; display: none; }
        .success-message { color: #2fae8f; font-size: 13px; margin-top: 8px; display: none; }
        .loading { display: none; }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo">
            <h1>⚽ FIFA 2026</h1>
            <p>Tournament Prediction Engine</p>
        </div>

        <form id="loginForm">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" required placeholder="Enter your username" autocomplete="username">
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required placeholder="Enter your password" autocomplete="current-password">
            </div>

            <button type="submit">
                <span class="login-text">Login</span>
                <span class="loading">Logging in...</span>
            </button>

            <div class="error-message" id="errorMsg"></div>
            <div class="success-message" id="successMsg"></div>
        </form>
    </div>

    <script>
        const form = document.getElementById('loginForm');
        const errorMsg = document.getElementById('errorMsg');
        const successMsg = document.getElementById('successMsg');
        const loginText = document.querySelector('.login-text');
        const loadingText = document.querySelector('.loading');
        const submitBtn = form.querySelector('button');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            errorMsg.style.display = 'none';
            successMsg.style.display = 'none';

            submitBtn.disabled = true;
            loginText.style.display = 'none';
            loadingText.style.display = 'inline';

            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password }),
                });

                const data = await response.json();

                if (data.success) {
                    successMsg.textContent = data.message;
                    successMsg.style.display = 'block';
                    setTimeout(() => { window.location.href = '/dashboard'; }, 800);
                } else {
                    errorMsg.textContent = data.message;
                    errorMsg.style.display = 'block';
                    submitBtn.disabled = false;
                    loginText.style.display = 'inline';
                    loadingText.style.display = 'none';
                }
            } catch (error) {
                errorMsg.textContent = 'Login failed. Please try again.';
                errorMsg.style.display = 'block';
                submitBtn.disabled = false;
                loginText.style.display = 'inline';
                loadingText.style.display = 'none';
            }
        });
    </script>
</body>
</html>
